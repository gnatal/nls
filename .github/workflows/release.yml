# Build, test and publish release binaries.
#
#   git tag v0.1.0 && git push origin v0.1.0   -> builds, tests, creates the GitHub release
#   Actions tab -> Release -> "Run workflow"   -> dry run: builds and tests, publishes nothing
#
# The tag must match NL_VERSION in src/nl.h. See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            cflags: ''
            ldflags: -static
          - os: ubuntu-24.04-arm
            target: linux-arm64
            cflags: ''
            ldflags: -static
          - os: macos-15
            target: macos-universal
            cflags: -arch arm64 -arch x86_64 -mmacosx-version-min=11.0
            ldflags: ''
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches NL_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(make -s version)"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match NL_VERSION $v in src/nl.h"
            exit 1
          fi

      # zsh and mandoc: the shell-integration, completion and man page tests
      # (bash 4+ is already there; macOS ships zsh and mandoc, bash 3.2 only).
      - name: Install tools for the execution tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq jq ffmpeg zsh mandoc

      - name: Build
        run: |
          make clean
          make CFLAGS="-std=c11 -O2 -Wall -Wextra -pedantic -Werror ${{ matrix.cflags }}" \
               LDFLAGS="${{ matrix.ldflags }}"
          file nls
          ./nls --version

      - name: Check the Linux binary is static
        if: runner.os == 'Linux'
        run: file nls | grep -q 'statically linked'

      - name: Test
        run: make test

      - name: Package
        run: make dist TARGET=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: nls-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$v]' section"
            exit 1
          fi
          cat notes.md

      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          cat SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "nls ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
